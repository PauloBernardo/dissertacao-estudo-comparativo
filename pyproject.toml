[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-lssvm-transformers-study"
version = "0.1.0"
description = "Comparative study: sparse LSSVM methods vs sparse Tabular Transformers"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "torch>=2.2",
    "optuna>=3.5",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "plotly>=5.20",
    "scikit-posthocs>=0.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "joblib>=1.3",
    "xgboost>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "black>=24.0",
    "ruff>=0.3",
    "mypy>=1.9",
    "isort>=5.13",
    "pre-commit>=3.7",
]
gpu = [
    "cupy-cuda12x>=13.0",
]
transformers = [
    "entmax>=1.0",
    "einops>=0.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
